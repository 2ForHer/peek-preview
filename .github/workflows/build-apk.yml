name: Build Peek Grok APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "public/updates/**"

permissions:
  contents: write

concurrency:
  group: peek-preview-grok-release
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Compute release version
        id: version
        run: |
          VERSION_CODE=${{ github.run_number }}
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore Grok-only release keystore
        run: |
          base64 -d signing/peek-preview-grok-release.jks.base64 > "$RUNNER_TEMP/peek-preview-grok-release.jks"
          chmod 600 "$RUNNER_TEMP/peek-preview-grok-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/peek-preview-grok-release.jks" \
            -storepass "PeekGrok-Release-2026" \
            -alias peekpreviewgrok > /dev/null

      - name: Build signed release APK
        env:
          PEEK_BUILD_VARIANT: release
          PEEK_VERSION_CODE: ${{ steps.version.outputs.code }}
          PEEK_VERSION_NAME: ${{ steps.version.outputs.name }}
          PEEK_KEYSTORE_PASSWORD: "PeekGrok-Release-2026"
          PEEK_KEY_ALIAS: peekpreviewgrok
          PEEK_KEY_PASSWORD: "PeekGrok-Release-2026"
        run: |
          export PEEK_KEYSTORE_PATH="$RUNNER_TEMP/peek-preview-grok-release.jks"
          npm run android:apk

      - name: Stage APK artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Peek-Grok.apk
          test -s Peek-Grok.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          path: Peek-Grok.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Peek-Grok.apk --clobber
            gh release edit "$TAG" \
              --title "Peek Grok $TAG" \
              --notes "Separate Grok app. Does not replace Lovable Peek Preview." \
              --latest
          else
            gh release create "$TAG" Peek-Grok.apk \
              --target "${{ github.sha }}" \
              --title "Peek Grok $TAG" \
              --notes "Separate Grok app. Does not replace Lovable Peek Preview." \
              --latest
          fi
